[project]
name = "servo-drive-demo"
version = "0.2.0"
description = "A modern simulated servo-drive commissioning workstation"
requires-python = ">=3.10"
dependencies = [
    "PyQt5>=5.15.11,<6",
]

[project.optional-dependencies]
build = [
    "pyinstaller>=6.11",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "servo_ui", "servo_core", "servo_animations", "servo_visuals"]
